<!doctype html>
<html><head><title>Notes App</title></head><body>
<h1>Notes App</h1>
<form method="post" action="/add/">{% csrf_token %}
<input name="title" placeholder="Title" required><br><textarea name="content" placeholder="Write note..." required></textarea><br><button>Add Note</button></form>
<hr>{% for note in notes %}<article><h2>{{ note.title }}</h2><p>{{ note.content }}</p><small>{{ note.created_at }}</small> <a href="/delete/{{ note.id }}/">Delete</a></article>{% empty %}<p>No notes.</p>{% endfor %}
</body></html>
